<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена · Владислав Алексеев</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" id="ic">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Manrope:wght@400;500&display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3EDE6;color:#1F1A1B;font-family:Manrope,system-ui,sans-serif;text-align:center;padding:24px}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,56px);margin:0 0 14px}
p{color:#6C605E;margin:0 0 28px}
a{display:inline-block;padding:14px 26px;border-radius:999px;background:#6E1F2B;color:#FBF3EE;text-decoration:none}
</style>
</head>
<body><div><h1>Такой страницы нет</h1><p>Возможно, ссылка устарела. Вернитесь на главную.</p><a href="/" id="home">На главную</a></div>
<script>/* на адресе вида логин.github.io/папка/ главная лежит в папке */
(function(){var s=location.pathname.split("/")[1];if(/github\.io$/.test(location.hostname)&&s){var b="/"+s+"/";document.getElementById("home").href=b;document.getElementById("ic").href=b+"favicon.svg";}})();</script></body>
</html>
